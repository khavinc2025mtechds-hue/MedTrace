services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://medtrace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/medtrace
    depends_on:
      db: {condition: service_healthy}
  dashboard:
    build: .
    ports: ["127.0.0.1:8501:8501"]
    environment: {MEDTRACE_API_URL: "http://api:8000"}
    depends_on: [api]
    command: python -m streamlit run app/streamlit_app.py --server.address 0.0.0.0
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medtrace
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtrace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
